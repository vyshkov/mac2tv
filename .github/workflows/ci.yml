name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Validate
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Build Debug
        run: swift build -v

      - name: Build Release
        run: swift build -c release -v

      - name: Package macOS App Bundle
        run: ./scripts/package_app.sh

      - name: Verify App Bundle Structure
        run: |
          test -d MKVAirPlay.app
          test -f MKVAirPlay.app/Contents/Info.plist
          test -x MKVAirPlay.app/Contents/MacOS/MKVAirPlay
          echo "App bundle successfully verified!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MKVAirPlay-macOS-app
          path: MKVAirPlay.app
          if-no-files-found: error
